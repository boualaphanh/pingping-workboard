<!DOCTYPE html>
<!-- THROWAWAY PROTOTYPE — NO NETWORK CALLS — DO NOT COPY INTO pingping-mobile.
     P04 Add Child Profile
     Features: E3 multi-child — the name the family sees, the age band the content uses
     States: loading · empty (nothing typed) · error (save failed) · ok -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P04 · Add child</title>
<link rel="stylesheet" href="../shell/base.css">
<link rel="stylesheet" href="../tokens/parent.css">
<link rel="stylesheet" href="../tokens/kids.css">
<link rel="stylesheet" href="../shell/components.css">
<style>
  md-outlined-text-field { width: 100%; }
  .p04-pic { width: 84px; height: 84px; border-radius: 50%; overflow: hidden; margin: 0 auto; }
  .p04-pic > svg { width: 100%; height: 100%; }
</style>
<script type="module" src="../vendor/material-web/all.js"></script>
<script src="../i18n/en.js"></script>
<script src="../i18n/lo.js"></script>
<script src="../fixtures/seed.js"></script>
</head>
<body data-app="parent" data-theme="light" data-lang="en" data-state="ok">

<div class="pp-screen">
  <header class="pp-appbar">
    <button class="pp-touch" aria-label="Back" onclick="history.back()"><span class="pp-icon">arrow_back</span></button>
    <span class="pp-appbar-title" data-i18n="p04_title"></span>
  </header>
  <main class="pp-content">

    <div data-state-view="ok" class="pp-flex" style="flex-direction:column;gap:var(--pp-s3)">
      <div class="p04-pic" data-avatar="family01.children.0"></div>
      <md-text-button data-i18n="p04_photo" style="align-self:center"></md-text-button>
      <p class="pp-label" data-i18n="p04_lede"></p>
      <md-outlined-text-field data-i18n-attr="label:p04_name_label,placeholder:p04_name_hint"></md-outlined-text-field>
      <md-outlined-text-field type="number" value="11" data-i18n-attr="label:p04_age_label"></md-outlined-text-field>
      <md-filled-button data-i18n="p04_save"></md-filled-button>
    </div>

    <div data-state-view="loading" class="pp-flex" style="flex-direction:column;gap:var(--pp-s3)">
      <div class="pp-skel" style="width:84px;height:84px;border-radius:50%;align-self:center"></div>
      <div class="pp-skel" style="height:11px;width:60%"></div>
      <div class="pp-skel" style="height:56px;width:100%"></div>
      <div class="pp-skel" style="height:56px;width:100%"></div>
      <div class="pp-skel" style="height:40px;width:100%"></div>
    </div>

    <div data-state-view="empty" class="pp-flex" style="flex-direction:column;gap:var(--pp-s3)">
      <md-outlined-text-field data-i18n-attr="label:p04_name_label,placeholder:p04_name_hint"></md-outlined-text-field>
      <div class="pp-figure">
        <span class="pp-icon">person_add</span>
        <h2 class="pp-title" data-i18n="p04_empty_title"></h2>
        <p data-i18n="p04_empty_body"></p>
      </div>
    </div>

    <div data-state-view="error" class="pp-flex" style="flex-direction:column;gap:var(--pp-s3)">
      <div class="pp-figure" data-tone="error">
        <span class="pp-icon">cloud_off</span>
        <h2 class="pp-title" data-i18n="p04_error_title"></h2>
        <p data-i18n="p04_error_body"></p>
        <md-filled-button data-i18n="common_retry" style="margin-top:var(--pp-s2)"></md-filled-button>
      </div>
    </div>

  </main>

</div>

<script src="../shell/screen.js"></script>
</body>
</html>
